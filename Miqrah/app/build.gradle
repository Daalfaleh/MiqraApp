plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs'
}

android {
    compileSdkVersion compile_sdk_version

    defaultConfig {
        applicationId app_id
        minSdkVersion min_sdk_version
        targetSdkVersion compile_sdk_version
        versionCode version_code
        versionName version_name
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    dataBinding {
        enabled = true
    }
    viewBinding {
        enabled = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation coreDependencies.app_compat
    implementation coreDependencies.constraint_layout
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation files('libs\\libjprayertime-0.2.jar')
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.1.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation files('libs\\jsoup-1.6.0.jar')
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.12'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.android.gms:play-services-location:15.0.0'
    implementation 'com.karumi:dexter:6.2.2'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'com.jakewharton.timber:timber:3.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'com.yayandroid:LocationManager:2.4.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:+'

    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'

    implementation 'com.bartoszlipinski.recyclerviewheader:library:1.2.0'
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'

    implementation 'com.github.kenmeidearu:MaterialDateTimePicker:1.0.0'
    implementation 'com.github.medyo:android-about-page:1.2.5'
    implementation 'com.google.firebase:firebase-ads:18.3.0'
    // Hawk Library
    implementation "com.orhanobut:hawk:2.0.1"
    // Permission Library
    implementation 'com.guolindev.permissionx:permissionx:1.6.1'

   // implementation project(':prayapp')


    implementation navigationDependencies.navigation
    implementation navigationDependencies.navigation_ui

    // Hilt
    implementation hiltDependencies.hilt
    kapt hiltDependencies.hilt_android_compiler
    kapt hiltDependencies.hilt_compiler
    implementation hiltDependencies.hilt_nav

    // splash
    implementation splash.core_splash

    // glide
    implementation glideDependency.glide
    implementation glideDependency.glide_compiler

    // tooltip
    implementation simple.tooltip

    // Picasso
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Room
    implementation "androidx.room:room-runtime:2.3.0"
    annotationProcessor "androidx.room:room-compiler:2.3.0"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation 'androidx.work:work-runtime-ktx:2.7.0'

    // circular progress
    implementation 'com.mikhaellopez:circularprogressbar:3.0.3'

}